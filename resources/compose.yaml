services:
  ollama:
    image: docker.io/ollama/ollama:latest
    container_name: ai-box-ollama
    volumes:
      - ollama-models:/root/.ollama
    ports:
      - "11434:11434"
    restart: unless-stopped

  main:
    build: .
    image: ghcr.io/nhat-14/ollama-edge-app:develop
    container_name: ollama-edge-app
    depends_on:
      - ollama
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: tinyllama
    restart: unless-stopped

volumes:
  ollama-models:
